[workspace]
resolver = "3"
members = ["crates/llm", "crates/agent", "crates/storage", "crates/mcp", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Asutorufa <asutorufa@gmail.com>"]
license = "MIT"

[workspace.dependencies]
bytes = "1.12.0"
futures-util = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "json",
    "query",
    "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = ["macros", "rt"] }
url = "2.5.8"
mockito = "1.7.2"
async-trait = "0.1.92"
tokio-util = "0.7.20"
tracing = "0.1.44"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
uuid = { version = "1.29.3", features = ["v7"] }
axum = "0.8.9"
tower-http = { version = "0.6.11", features = ["fs", "trace"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
