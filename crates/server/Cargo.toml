[package]
name = "oort-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "HTTP/SSE workbench backend for the oort agent engine"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oort-server"
path = "src/main.rs"

[dependencies]
oort-agent = { path = "../agent" }
oort-llm = { path = "../llm" }
oort-mcp = { path = "../mcp" }
oort-storage = { path = "../storage" }
async-trait = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal", "fs"] }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
sqlx = { workspace = true }
